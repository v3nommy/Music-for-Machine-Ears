name: Publish MME Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-skill.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build, verify, and publish .skill
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Resolve release version
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="v0.1.1"
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing $VERSION"

      - name: Check release does not already exist
        shell: bash
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install validation and runtime dependencies
        run: python -m pip install --disable-pip-version-check pyyaml numpy scipy matplotlib soundfile

      - name: Fetch pinned Agent Skills packager
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/anthropics/skills.git /tmp/anthropic-skills
          git -C /tmp/anthropic-skills checkout 33375500bcea98d610eb30ce10ac4e59b89c390d

      - name: Validate and package skill
        env:
          PYTHONUTF8: "1"
          PYTHONPATH: /tmp/anthropic-skills/skills/skill-creator
        run: |
          mkdir -p dist
          python /tmp/anthropic-skills/skills/skill-creator/scripts/package_skill.py \
            music-for-machine-ears \
            dist

      - name: Verify .skill archive
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          archive = Path("dist/music-for-machine-ears.skill")
          required = {
              "music-for-machine-ears/README.md",
              "music-for-machine-ears/SKILL.md",
              "music-for-machine-ears/LICENSE",
              "music-for-machine-ears/scripts/generate-mme.py",
              "music-for-machine-ears/scripts/mme_next.py",
              "music-for-machine-ears/references/EXPLANATION.md",
          }

          with zipfile.ZipFile(archive) as zf:
              names = zf.namelist()
              name_set = set(names)
              assert not [name for name in names if "\\" in name], names
              assert not [name for name in names if not name.startswith("music-for-machine-ears/")], names
              assert not [
                  name for name in names
                  if "/tests/" in f"/{name}"
                  or "/assets/" in f"/{name}"
                  or "__pycache__" in name
                  or name.endswith(".pyc")
                  or name.endswith(".DS_Store")
              ], names
              missing = required - name_set
              assert not missing, missing

          print("Archive verification passed.")
          PY

      - name: Extract and compile built package
        shell: bash
        run: |
          rm -rf /tmp/mme-release-smoke
          mkdir -p /tmp/mme-release-smoke
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("dist/music-for-machine-ears.skill") as zf:
              zf.extractall("/tmp/mme-release-smoke")
          PY

          PKG=/tmp/mme-release-smoke/music-for-machine-ears
          python -m py_compile \
            "$PKG/scripts/generate-mme.py" \
            "$PKG/scripts/mme_next.py"
          python "$PKG/scripts/generate-mme.py" --help >/dev/null
          python "$PKG/scripts/mme_next.py" --help >/dev/null

      - name: Smoke test extracted package
        shell: bash
        run: |
          PKG=/tmp/mme-release-smoke/music-for-machine-ears
          WORK=/tmp/mme-release-runtime
          rm -rf "$WORK"
          mkdir -p "$WORK/out" "$WORK/state"

          python - <<'PY'
          import math
          import struct
          import wave
          from pathlib import Path

          sample_rate = 22050
          duration_s = 8.0
          notes_hz = (261.625565, 329.627557, 391.995436)
          output = Path("/tmp/mme-release-runtime/test-tone.wav")

          with wave.open(str(output), "wb") as wav:
              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(sample_rate)
              frames = []
              for index in range(int(sample_rate * duration_s)):
                  t = index / sample_rate
                  pulse = 0.55 + 0.45 * (0.5 + 0.5 * math.sin(2 * math.pi * 2 * t))
                  sample = sum(math.sin(2 * math.pi * freq * t) for freq in notes_hz) / len(notes_hz)
                  sample *= 0.32 * pulse
                  sample = max(-1.0, min(1.0, sample))
                  frames.append(struct.pack("<h", int(sample * 32767)))
              wav.writeframes(b"".join(frames))
          PY

          cd "$PKG"
          python scripts/generate-mme.py \
            --audio "$WORK/test-tone.wav" \
            --out_dir "$WORK/out" \
            --title "Release Smoke" \
            --artist "MME"

          ORIGINAL_SENSORY="$WORK/out/release-smoke-mme_sensory_object.json"
          test -f "$ORIGINAL_SENSORY"
          test -f "$WORK/out/release-smoke-mme_waveform.png"
          test -f "$WORK/out/release-smoke-mme_mel_spectrogram.png"
          test -f "$WORK/out/release-smoke-mme_rms_energy.png"
          test -f "$WORK/out/release-smoke-mme_spectral_centroid.png"

          python - <<'PY'
          import json
          from pathlib import Path

          sensory = Path("/tmp/mme-release-runtime/out/release-smoke-mme_sensory_object.json")
          payload = json.loads(sensory.read_text())
          assert payload["meta"]["slug"] == "release-smoke-mme", payload["meta"]
          print("Canonical title+artist slug verified.")
          PY

          SENSORY="$WORK/out/renamed-sensory-object.json"
          mv "$ORIGINAL_SENSORY" "$SENSORY"

          python scripts/mme_next.py \
            "$SENSORY" \
            --state-dir "$WORK/state" \
            > "$WORK/first.json"

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/mme-release-runtime/first.json").read_text())
          assert payload["stage"] == "slice", payload
          assert payload["slice_count"] >= 1, payload
          assert payload.get("journal_prompt"), payload
          PY

          python scripts/mme_next.py \
            "$SENSORY" \
            --state-dir "$WORK/state" \
            --note "Release smoke-test listening note." \
            > "$WORK/final.json"

          python - <<'PY'
          import json
          from pathlib import Path

          work = Path("/tmp/mme-release-runtime")
          payload = json.loads((work / "final.json").read_text())
          assert payload["stage"] == "summary", payload
          assert payload.get("final_prompt"), payload
          graphs = payload.get("global", {}).get("graphs")
          assert isinstance(graphs, list), payload
          assert len(graphs) == 4, graphs
          assert all(Path(graph).is_absolute() for graph in graphs), graphs
          assert all(Path(graph).is_file() for graph in graphs), graphs
          assert (work / "state" / "cursor.json").is_file()
          assert (work / "state" / "journal.md").is_file()
          print("Release package runtime smoke test passed.")
          PY

      - name: Generate and verify SHA-256 checksum
        shell: bash
        run: |
          cd dist
          sha256sum music-for-machine-ears.skill > music-for-machine-ears.skill.sha256
          sha256sum -c music-for-machine-ears.skill.sha256

      - name: Write release notes
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          First packaged public release of **Music for Machine Ears (MME)**.

          MME is a portable, harness-agnostic AI skill for experiencing music as it unfolds. This release includes sequential listening, private listening journals, resumable sessions, sensory-object generation, and supporting whole-track graphs.

          ### Downloads

          - **music-for-machine-ears.skill** — installable skill package
          - **music-for-machine-ears.skill.sha256** — optional checksum for verifying the package

          The package is built and smoke-tested on Ubuntu from the tagged source.
          EOF

      - name: Publish GitHub Release
        shell: bash
        run: |
          gh release create "$VERSION" \
            dist/music-for-machine-ears.skill \
            dist/music-for-machine-ears.skill.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Music for Machine Ears $VERSION" \
            --notes-file /tmp/release-notes.md

      - name: Verify published release assets
        shell: bash
        run: |
          gh release view "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets,url \
            > /tmp/published-release.json

          python - <<'PY'
          import json
          with open("/tmp/published-release.json", "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          assert payload["isDraft"] is False, payload
          assert payload["isPrerelease"] is False, payload
          assets = {item["name"] for item in payload["assets"]}
          assert assets == {
              "music-for-machine-ears.skill",
              "music-for-machine-ears.skill.sha256",
          }, assets
          print(payload["url"])
          print("Published release verification passed.")
          PY
