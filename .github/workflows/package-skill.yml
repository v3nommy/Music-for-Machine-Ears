name: Build MME Skill

on:
  push:
    branches:
      - main
    paths:
      - "music-for-machine-ears/**"
      - ".github/workflows/package-skill.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package .skill on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Fetch pinned Agent Skills packager
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/anthropics/skills.git /tmp/anthropic-skills
          git -C /tmp/anthropic-skills checkout 33375500bcea98d610eb30ce10ac4e59b89c390d

      - name: Validate and package skill
        env:
          PYTHONUTF8: "1"
          PYTHONPATH: /tmp/anthropic-skills/skills/skill-creator
        run: |
          mkdir -p dist
          python /tmp/anthropic-skills/skills/skill-creator/scripts/package_skill.py \
            music-for-machine-ears \
            dist

      - name: Verify .skill archive
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          archive = Path("dist/music-for-machine-ears.skill")
          if not archive.is_file():
              raise SystemExit("Package was not created.")

          required = {
              "music-for-machine-ears/README.md",
              "music-for-machine-ears/SKILL.md",
              "music-for-machine-ears/LICENSE",
              "music-for-machine-ears/scripts/generate-mme.py",
              "music-for-machine-ears/scripts/mme_next.py",
              "music-for-machine-ears/references/EXPLANATION.md",
          }

          with zipfile.ZipFile(archive) as zf:
              names = zf.namelist()
              name_set = set(names)
              bad_backslashes = [name for name in names if "\\" in name]
              outside_root = [
                  name for name in names
                  if not name.startswith("music-for-machine-ears/")
              ]
              junk = [
                  name for name in names
                  if (
                      "/tests/" in f"/{name}"
                      or "/assets/" in f"/{name}"
                      or "__pycache__" in name
                      or name.endswith(".pyc")
                      or name.endswith(".DS_Store")
                  )
              ]
              missing = sorted(required - name_set)

              if bad_backslashes:
                  raise SystemExit(f"Backslash ZIP paths found: {bad_backslashes}")
              if outside_root:
                  raise SystemExit(f"Files outside skill root found: {outside_root}")
              if junk:
                  raise SystemExit(f"Development/presentation files leaked into package: {junk}")
              if missing:
                  raise SystemExit(f"Required package files missing: {missing}")

              print("Archive verification passed.")
              print(f"Files packaged: {len(names)}")
              for name in names:
                  print(f"  {name}")
          PY

      - name: Upload development package artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-for-machine-ears-skill-main
          path: dist/music-for-machine-ears.skill
          if-no-files-found: error
          retention-days: 14
